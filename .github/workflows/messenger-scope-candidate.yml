name: Messenger scope candidate
on:
  push:
    branches: [fix/messenger-approved-scopes-candidate-20261019]
permissions:
  contents: read
concurrency:
  group: messenger-scope-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact base and allowed diff
        run: |
          python3 - <<'PY'
          import subprocess
          base = '54c1287b788d07082b9a1456e1b511dee2661adb'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          allowed = {'integrations/messenger/src/apis/auth.ts','integrations/messenger/__tests__/generate-auth-url.test.ts','.github/workflows/messenger-scope-candidate.yml','apps/builder/src/lib/oauth-referer.ts','apps/builder/__tests__/oauth-referer-auth-origin.test.ts','apps/builder/src/features/integration-messenger/actions/reconnect-callback.ts','apps/builder/src/features/integration-messenger/libs/reconnect-diagnostic.ts','apps/builder/__tests__/messenger-reconnect-diagnostic.test.ts','apps/builder/__tests__/channel-reconnect-handlers.test.ts'}
          changed = set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed == allowed, 'Unexpected candidate scope'
          subprocess.run(['git','diff','--check',base,'HEAD'],check=True)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Lint and instruction checks
        run: |
          pnpm check:agent-instructions
          pnpm --filter builder lint
          pnpm exec biome check .
      - name: Messenger type and regression gates
        run: |
          pnpm --filter @chatbotx.io/integration-messenger check-types
          pnpm --filter @chatbotx.io/integration-messenger exec vitest run --maxWorkers 2
      - name: Builder origin security gates
        run: |
          pnpm --filter builder check-types
          pnpm --filter builder exec vitest run __tests__/oauth-referer-auth-origin.test.ts __tests__/messenger-reconnect-diagnostic.test.ts __tests__/channel-reconnect-handlers.test.ts __tests__/oauth-reconnect-callback.test.ts --maxWorkers 2 --coverage --coverage.include=src/lib/oauth-referer.ts --coverage.include=src/features/integration-messenger/libs/reconnect-diagnostic.ts
      - name: Validate synthetic runtime configuration
        run: |
          pnpm exec tsx --tsconfig apps/builder/tsconfig.json -e '
            (async()=>{
              await import("./packages/vitest-config/src/setup-env.ts");
              const {execFileSync}=await import("node:child_process");
              const files=execFileSync("git",["ls-files"],{encoding:"utf8"}).split("\n").filter(p=>p.startsWith("packages/")&&p.endsWith("/keys.ts"));
              for(const file of files){const m=await import("./"+file);for(const name of ["keys","integrationContextEnv","javascriptExecutionEnv"]){if(typeof m[name]==="function")m[name]();}}
              await import("./apps/builder/src/env.ts");
              console.log("Synthetic runtime environment validators passed");
            })().catch(e=>{console.error(e.message);process.exitCode=1});'
  candidate:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tracked-only source context
        run: |
          mkdir -p "$RUNNER_TEMP/scope-context"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/scope-context"
          python3 - <<'PY'
          import os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'scope-context'
          for p in root.rglob('*'):
            if p.is_file() and (p.name=='.env' or p.name.startswith('.env.')):
              p.unlink()
          assert not (root/'.git').exists()
          forbidden={'.secrets','node_modules','.next','.turbo','docker-data'}
          assert not any(p.name in forbidden for p in root.rglob('*'))
          PY
          free -h
          df -h "$RUNNER_TEMP"
          uname -m
      - uses: docker/setup-buildx-action@v3
      - name: Monitor runner memory
        run: |
          (while true; do date -u; free -m; sleep 15; done) > "$RUNNER_TEMP/memory.log" &
          echo "MEMORY_MONITOR_PID=$!" >> "$GITHUB_ENV"
      - name: Build only the candidate runtime
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/scope-context
          file: ${{ runner.temp }}/scope-context/apps/builder/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: scope-candidate:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=messenger-scope-candidate
          cache-to: type=gha,scope=messenger-scope-candidate,mode=min
      - name: Isolated runtime health and route smoke
        run: |
          docker network create --internal scope-smoke-net
          docker run -d --name scope-redis --network scope-smoke-net --memory 128m --cpus 1 redis:7-alpine redis-server --save "" --appendonly no
          for i in $(seq 1 20); do
            if docker exec scope-redis redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          docker exec scope-redis redis-cli ping | grep -q PONG
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs';
          const before=new Set(Object.keys(process.env));
          await import('./packages/vitest-config/src/setup-env.ts');
          const added=Object.keys(process.env).filter(k=>!before.has(k));
          const overrides={HOSTNAME:'0.0.0.0',PORT:'3000',RUN_DB_MIGRATE:'false',RUN_DB_SEED:'false',DATABASE_DEBUG:'false',REDIS_URL:'redis://scope-redis:6379',BETTER_AUTH_URL:'http://localhost:3000',NEXT_PUBLIC_BUILDER_URL:'http://localhost:3000',MESSENGER_OAUTH_MESSAGING_ONLY_APP_IDS:'approved-app'};
          Object.assign(process.env,overrides);
          const keys=[...new Set([...added,...Object.keys(overrides)])];
          fs.writeFileSync(process.env.RUNNER_TEMP+'/scope-runtime.env',keys.map(k=>k+'='+process.env[k]).join('\n')+'\n',{mode:0o600});
          console.log('Generated synthetic-only runtime fixture outside the build context');
          JS
          docker run -d --name scope-smoke --network scope-smoke-net --memory 4g --cpus 2 \
            --env-file "$RUNNER_TEMP/scope-runtime.env" "scope-candidate:$GITHUB_SHA"
          docker exec -i scope-smoke node <<'JS'
          const assert=require('node:assert/strict');
          const origin='http://127.0.0.1:3000';
          (async()=>{
            let ready=false;
            for(let i=0;i<120;i++){
              try{const r=await fetch(origin+'/api/health',{signal:AbortSignal.timeout(2000)});if(r.status===200){const b=await r.json();assert.equal(b.status,'healthy');assert.equal(b.service,'builder');ready=true;break}}catch{}
              await new Promise(r=>setTimeout(r,1000));
            }
            assert(ready,'Runtime failed to become healthy');
            const cases=[['/',307],['/integrations/messenger/callback',404],['/integrations/instagram-facebook/callback',404],['/integrations/unknown/callback',404]];
            for(const [path,expected] of cases){const r=await fetch(origin+path,{redirect:'manual',signal:AbortSignal.timeout(10000)});assert.equal(r.status,expected,path);if(path==='/')assert(r.headers.get('location').includes('/auth/sign-in'));console.log(JSON.stringify({path,status:r.status}));}
            console.log('Isolated health and fail-closed callback smoke passed; no external provider or database access');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Log in to existing container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish unique candidate only
        run: |
          image="ghcr.io/marsbdigital/chatbotx-review-builder:scope-candidate-$GITHUB_SHA"
          docker tag "scope-candidate:$GITHUB_SHA" "$image"
          docker push "$image"
          docker buildx imagetools inspect "$image" >> "$GITHUB_STEP_SUMMARY"
          printf '\nCandidate revision: %s\nRuntime smoke: passed\nNo deployment performed.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Diagnostic summary and cleanup
        if: always()
        run: |
          if [ -n "${MEMORY_MONITOR_PID:-}" ]; then kill "$MEMORY_MONITOR_PID" || true; fi
          tail -n 30 "$RUNNER_TEMP/memory.log" || true
          docker inspect --format '{{json .State}}' scope-smoke || true
          docker logs scope-smoke || true
          docker rm -f scope-smoke scope-redis 2>/dev/null || true
          docker network rm scope-smoke-net 2>/dev/null || true
